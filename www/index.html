<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Rivals 3D Arena Showdown</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    
    <!-- Load Socket.io and High Performance Three.js 3D Engine from CDN -->
    <script src="https://socket.io"></script>
    <script src="https://cloudflare.com"></script>
    
    <style>
        * { 
            box-sizing: border-box; 
            -webkit-tap-highlight-color: transparent; 
            user-select: none; 
            touch-action: none; 
        }
        body, html { 
            margin: 0; 
            padding: 0; 
            width: 100%; 
            height: 100%; 
            background: #0b0d11; 
            overflow: hidden; 
            font-family: -apple-system, BlinkMacSystemFont, sans-serif; 
        }
        #canvas3d { 
            display: block; 
            width: 100vw; 
            height: 100vh; 
        }
        /* Telemetry Dashboard Layer overlayed cleanly on top of WebGL */
        .hud-overlay {
            position: absolute;
            top: 20px;
            width: 100%;
            display: flex;
            justify-content: space-between;
            padding: 0 40px;
            pointer-events: none;
        }
        .hud-card {
            background: rgba(26, 31, 38, 0.85);
            border: 2px solid #323c4b;
            padding: 12px 24px;
            border-radius: 8px;
            color: #fff;
            font-weight: bold;
            font-size: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.4);
        }
        .screen-overlay-msg {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #fff;
            font-size: 28px;
            font-weight: bold;
            text-align: center;
            background: rgba(20, 24, 30, 0.9);
            padding: 20px 40px;
            border-radius: 12px;
            border: 2px solid #ff3232;
            pointer-events: none;
        }
        .mobile-controls { 
            display: none; 
            width: 100%; 
            justify-content: space-between; 
            padding: 0 40px; 
            position: absolute; 
            bottom: 6vh; 
            pointer-events: none;
        }
        .d-pad, .action-pad { pointer-events: auto; }
        .btn { 
            width: 80px; 
            height: 80px; 
            background: rgba(255,255,255,0.1); 
            border: 2px solid rgba(255,255,255,0.4); 
            border-radius: 50%; 
            color: white; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            font-weight: bold; 
            font-size: 16px; 
        }
        .btn:active { background: rgba(255,255,255,0.3); border-color: #fff; }
        #btnShoot { width: 95px; height: 95px; background: rgba(255, 50, 50, 0.25); border-color: #ff3232; font-size: 18px; }
        #btnShoot:active { background: rgba(255, 50, 50, 0.6); }
        @media (max-width: 1024px) { .mobile-controls { display: flex; } }
    </style>
</head>
<body>

<div class="hud-overlay">
    <div class="hud-card" id="p1-hp-card" style="color: #00c8ff;">BLUE: 100 HP</div>
    <div class="hud-card" id="p2-hp-card" style="color: #ff3232;">RED: 100 HP</div>
</div>

<div class="screen-overlay-msg" id="status-panel">MATCHMAKING: SEARCHING FOR RIVALS...</div>

<div class="mobile-controls">
    <div class="d-pad">
        <div class="btn" id="btnUp">▲ UP</div>
        <div style="height: 15px;"></div>
        <div class="btn" id="btnDown">▼ DOWN</div>
    </div>
    <div class="action-pad">
        <div class="btn" id="btnShoot">FIRE</div>
    </div>
</div>

<div id="canvas3d"></div>

<script>
// --- CLOUD SERVER INSTANCE CONNECTION ---
// Paste your exact Render URL here (Keep the quotes!)
const SERVER_URL = "https://onrender.com"; 
const socket = io(SERVER_URL, { transports: ['websocket'], reconnection: true });

// --- THREE.JS INITIALIZATION MATRIX ---
const container = document.getElementById("canvas3d");
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x14181e);

// Add Atmospheric Ambient and Direct Sector Lighting
const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
scene.add(ambientLight);
const dirLight = new THREE.DirectionLight(0xffffff, 0.8);
dirLight.position.set(10, 20, 15);
scene.add(dirLight);

// Setup Camera perspective structures
const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
container.appendChild(renderer.domElement);

// --- ARENA FLOOR AND SECTOR BOUNDARIES ---
const floorGeo = new THREE.PlaneGeometry(160, 120);
const floorMat = new THREE.MeshStandardMaterial({ color: 0x1a1f26, roughness: 0.8 });
const floor = new THREE.Mesh(floorGeo, floorMat);
floor.rotation.x = -Math.PI / 2;
scene.add(floor);

// Center divider grid mesh translation
const dividerGeo = new THREE.BoxGeometry(1, 0.5, 120);
const dividerMat = new THREE.MeshStandardMaterial({ color: 0x323c4b });
const divider = new THREE.Mesh(dividerGeo, dividerMat);
scene.add(divider);

// --- 3D ACTOR ENTITIES MESH CONSTRUCTORS ---
const cubeGeo = new THREE.BoxGeometry(6, 6, 6);
const p1Mesh = new THREE.Mesh(cubeGeo, new THREE.MeshStandardMaterial({ color: 0x00c8ff, emissive: 0x004455 }));
const p2Mesh = new THREE.Mesh(cubeGeo, new THREE.MeshStandardMaterial({ color: 0xff3232, emissive: 0x551111 }));
scene.add(p1Mesh);
scene.add(p2Mesh);

// Hide meshes initially during matching phases
p1Mesh.visible = false;
p2Mesh.visible = false;

// Bullet object pooling buffers
let activeBullets = [];

// --- LOGICAL HUD TELEMETRY STATE PIPELINES ---
let gameState = "SEARCHING";
let pId = null;
let keys = {};

// Convert screen space layout models
const scaleX = (val) => (val - 400) * 0.2;
const scaleY = (val) => (val - 300) * -0.2;

// --- MULTIPLAYER SOURCING LOOP HANDSHAKES ---
socket.on("initPlayer", (assignedId) => {
    pId = assignedId;
    gameState = "PLAYING";
    document.getElementById("status-panel").style.display = "none";
    p1Mesh.visible = true;
    p2Mesh.visible = true;
    
    // Lock camera angle dynamically behind player assignment profile maps
    if (pId === 1) {
        camera.position.set(-70, 35, 0);
    } else {
        camera.position.set(70, 35, 0);
    }
});

socket.on("sceneUpdate", (data) => {
    if (gameState !== "PLAYING") return;

    // Map X & Y coordinates directly to 3D Transform Translation Vectors
    p1Mesh.position.set(scaleX(100), 3, scaleY(data.p1.y));
    p2Mesh.position.set(scaleX(660), 3, scaleY(data.p2.y));

    document.getElementById("p1-hp-card").innerText = `BLUE: ${data.p1.hp} HP`;
    document.getElementById("p2-hp-card").innerText = `RED: ${data.p2.hp} HP`;

    // Clear previous bullet meshes out of memory pool cleanly
    activeBullets.forEach(b => scene.remove(b));
    activeBullets = [];

    // Instantiate P1 white bullet spheres into the 3D grid layout
    data.p1B.forEach(b => {
        const sphere = new THREE.Mesh(new THREE.SphereGeometry(1.2, 8, 8), new THREE.MeshBasicMaterial({ color: 0xffffff }));
        sphere.position.set(scaleX(b.x), 3, scaleY(b.y));
        scene.add(sphere);
        activeBullets.push(sphere);
    });

    // Instantiate P2 yellow bullet spheres into the 3D grid layout
    data.p2B.forEach(b => {
        const sphere = new THREE.Mesh(new THREE.SphereGeometry(1.2, 8, 8), new THREE.MeshBasicMaterial({ color: 0xffff64 }));
        sphere.position.set(scaleX(b.x), 3, scaleY(b.y));
        scene.add(sphere);
        activeBullets.push(sphere);
    });
});

socket.on("gameOver", (winnerId) => {
    gameState = "GAME_OVER";
    const msg = winnerId === pId ? "VICTORY! RIVAL ELIMINATED" : "DEFEAT! YOU WERE ELIMINATED";
    const panel = document.getElementById("status-panel");
    panel.innerText = msg;
    panel.style.display = "block";
});

socket.on("opponentDisconnected", () => {
    gameState = "MATCH_ABORTED";
    const panel = document.getElementById("status-panel");
    panel.innerText = "OPPONENT LEFT THE ARENA";
    panel.style.color = "#ff3232";
    panel.style.display = "block";
});

// --- HARDWARE INPUT EVENT HANDLING MATRIX ---
window.addEventListener("keydown", e => { keys[e.code] = true; });
window.addEventListener("keyup", e => { keys[e.code] = false; });

const bindTouch = (id, keyCode) => {
    const el = document.getElementById(id);
    el.addEventListener("touchstart", (e) => { e.preventDefault(); keys[keyCode] = true; }, { passive: false });
    el.addEventListener("touchend", (e) => { e.preventDefault(); keys[keyCode] = false; }, { passive: false });
};
bindTouch("btnUp", "ArrowUp");
bindTouch("btnDown", "ArrowDown");

document.getElementById("btnShoot").addEventListener("touchstart", (e) => {
    e.preventDefault();
    if (gameState === "PLAYING") socket.emit("shootAction");
}, { passive: false });

// --- MAIN 3D GL RENDERING TICK LOOPS ---
function gameTick() {
    requestAnimationFrame(gameTick);

    if (gameState === "PLAYING") {
        let direction = 0;
        if (keys["KeyW"] || keys["ArrowUp"]) direction = -5;
        if (keys["KeyS"] || keys["ArrowDown"]) direction = 5;
        if (direction !== 0) socket.emit("moveAction", direction);

        if (keys["Space"] && !keys["shoot_cooldown"]) {
            socket.emit("shootAction");
            keys["shoot_cooldown"] = true;
            setTimeout(() => keys["shoot_cooldown"] = false, 250);
        }

        // Dynamically track camera look targets onto your assigned player model mesh
        if (pId === 1) {
            camera.lookAt(p1Mesh.position.x + 20, 0, p1Mesh.position.z);
        } else {
camera.lookAt(p2Mesh.position.x - 20, 0, p2Mesh.position.z);}} else {// Slow rotation animation during searching statescamera.position.x = 80 * Math.sin(Date.now() * 0.0005);camera.position.z = 80 * Math.cos(Date.now() * 0.0005);camera.position.y = 45;camera.lookAt(0, 0, 0);}renderer.render(scene, camera);}// Handle real-time device screen adjustmentswindow.addEventListener('resize', () => {camera.aspect = window.innerWidth / window.innerHeight;camera.updateProjectionMatrix();renderer.setSize(window.innerWidth, window.innerHeight);});gameTick();
